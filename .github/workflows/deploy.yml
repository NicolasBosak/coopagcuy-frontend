name: Desplegar Front

# develop -> staging; main -> producción (con aprobación en el entorno).
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: deploy-front-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # Solo despliega en push; los PR se quedan en build/typecheck
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # --prod: solo lo que se sirve al navegador. Las devDependencies
      # vulnerables no llegan al usuario y bloquearlas sería ruido; es el
      # mismo criterio que en el repo del API, donde el escaneo bloquea por
      # el proyecto que se despliega e informa por el de pruebas.
      #
      # Bloquea en Pull Request, informa en push: mismo criterio que la
      # cabecera de seguridad.yml en el repo del API ("en PR los hallazgos
      # bloquean; en push a main solo informan, para no dejar al proyecto
      # sin poder desplegar un arreglo urgente"). Este job despliega en
      # push, así que un HIGH publicado en cualquier dependencia —incluido
      # el propio hotfix que lo arregla— no puede bloquear producción. Y
      # `pnpm audit` consulta el registro de npm en vivo: una caída de
      # npmjs tampoco debe tumbar un despliegue.
      #
      # `if` explícito y no `... || exit 1` encadenado: mismo motivo que en
      # el repo del API, más explícito sobre qué evento bloquea.
      - name: Auditoría de dependencias
        run: |
          estado=0
          pnpm audit --prod --audit-level high || estado=$?
          if [ "$estado" -ne 0 ]; then
            echo "pnpm audit encontró dependencias vulnerables (o no pudo consultar el registro de npm)."
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              exit 1
            fi
          fi

      # Compila con la URL del API del entorno (staging o producción).
      # tsc -b corre dentro del script build, así que el typecheck
      # también bloquea aquí.
      - name: Compilar
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: pnpm build

      # Los PR solo verifican; el despliegue real ocurre en push
      - name: Desplegar a Static Web Apps
        if: github.event_name == 'push'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOY_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist       # carpeta ya compilada
          skip_app_build: true     # no recompilar: subimos el dist tal cual
          skip_api_build: true
